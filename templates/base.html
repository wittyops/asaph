<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Curator Review — curator.wittycomp.com</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --border: #272b34;
      --text: #d8dade;
      --text-dim: #8a8f9c;
      --accent: #5b8cff;
      --red: #e05c5c;
      --amber: #d9a441;
      --green: #4caf6e;
      --blue: #5b8cff;
    }
    * { box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      padding: 24px 32px;
      margin: 0;
      font-size: 14px;
      line-height: 1.5;
    }
    h2 {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.02em;
      margin: 0 0 18px 0;
    }
    h3 { font-size: 14px; margin: 24px 0 8px 0; color: var(--text); }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .stats { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    .stat-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-left: 3px solid var(--border-color, var(--accent));
      border-radius: 6px;
      padding: 10px 16px;
      min-width: 150px;
    }
    .stat-card .n { font-size: 22px; font-weight: 700; display: block; line-height: 1.2; }
    .stat-card .label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.04em; }
    .stat-card.quarantined { border-left-color: var(--red); }
    .stat-card.quarantined .n { color: var(--red); }
    .stat-card.usenet { border-left-color: var(--amber); }
    .stat-card.usenet .n { color: var(--amber); }
    .stat-card.validated { border-left-color: var(--green); }
    .stat-card.validated .n { color: var(--green); }

    table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
    thead th {
      text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em;
      color: var(--text-dim); padding: 10px 12px; border-bottom: 1px solid var(--border);
    }
    td, th { padding: 10px 12px; border-bottom: 1px solid var(--border); text-align: left; font-size: 13px; vertical-align: middle; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: #1c2029; }
    .empty-row td { color: var(--text-dim); text-align: center; padding: 32px 12px; }

    .badge {
      display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px;
      border-radius: 10px; text-transform: uppercase; letter-spacing: 0.03em;
    }
    .badge.corrupt   { background: rgba(224,92,92,0.15); color: var(--red); }
    .badge.metadata  { background: rgba(217,164,65,0.15); color: var(--amber); }
    .badge.usenet    { background: rgba(91,140,255,0.15); color: var(--blue); }
    .badge.validated { background: rgba(76,175,110,0.15); color: var(--green); }
    .badge.other     { background: rgba(138,143,156,0.15); color: var(--text-dim); }
    .badge.status-searching { background: rgba(217,164,65,0.15); color: var(--amber); }

    button, input[type=submit] {
      background: #1d2129; color: var(--text); border: 1px solid var(--border);
      border-radius: 5px; padding: 6px 12px; font-size: 12px; font-family: inherit;
      cursor: pointer; transition: background 0.1s, border-color 0.1s;
    }
    button:hover { background: #262b35; border-color: #3a4050; }
    button.approve { border-color: rgba(76,175,110,0.4); color: var(--green); }
    button.approve:hover { background: rgba(76,175,110,0.12); }
    button.delete { border-color: rgba(224,92,92,0.4); color: var(--red); }
    button.delete:hover { background: rgba(224,92,92,0.12); }
    button.primary { border-color: rgba(91,140,255,0.5); color: var(--blue); }
    button.primary:hover { background: rgba(91,140,255,0.12); }
    /* htmx adds this class to an element while its request is in flight --
       gives immediate click feedback instead of the button looking inert
       until the response (possibly seconds later) lands. */
    .htmx-request { opacity: 0.5; pointer-events: none; }

    input[type=text] {
      background: #10131a; color: var(--text); border: 1px solid var(--border);
      border-radius: 5px; padding: 6px 10px; font-size: 13px; font-family: inherit;
      margin-right: 6px;
    }

    .path { color: var(--text-dim); font-size: 12px; }
    .result-msg { margin-top: 10px; padding: 8px 12px; background: var(--panel); border: 1px solid var(--border); border-radius: 5px; font-size: 13px; }

    .detail-table td:first-child { color: var(--text-dim); width: 90px; }
    form { margin: 12px 0; }
    .hint { color: var(--text-dim); font-size: 12px; margin: 4px 0 10px 0; }

    nav { display: flex; gap: 16px; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
    nav a { color: var(--text-dim); font-size: 13px; text-decoration: none; }
    nav a.active { color: var(--text); font-weight: 600; }
    nav a:hover { color: var(--text); text-decoration: none; }
  </style>
</head>
<body>
  <nav>
    <a href="/review" class="{{ 'active' if nav == 'review' else '' }}">Review Queue</a>
    <a href="/acquire" class="{{ 'active' if nav == 'acquire' else '' }}">Acquire New</a>
    <a href="/watchlist" class="{{ 'active' if nav == 'watchlist' else '' }}">Watchlist</a>
  </nav>
  {% block content %}{% endblock %}
</body>
</html>
