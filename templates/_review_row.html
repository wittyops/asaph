<tr id="row-{{ item.id }}">
  <td>
    {{ item.filename }}
    {% if item.artist or item.album %}<br><span class="path">{{ item.artist }}{% if item.artist and item.album %} — {% endif %}{{ item.album }}</span>{% endif %}
  </td>
  <td><span class="badge {{ item.category }}">{{ item.category }}</span> {{ item.reason }}</td>
  <td>
    {% if item.status == 'searching' %}<span class="badge status-searching">&#9203; searching</span>{% else %}<span class="badge other">&#9208; awaiting review</span>{% endif %}
  </td>
  <td>
    <button class="approve" hx-post="/review/{{ item.id }}/approve" hx-target="#row-{{ item.id }}" hx-swap="outerHTML">Approve</button>
    <a href="/review/{{ item.id }}"><button type="button" class="primary">Open</button></a>
    <button class="delete" hx-post="/review/{{ item.id }}/delete" hx-target="#row-{{ item.id }}" hx-swap="outerHTML" hx-confirm="Delete this file permanently?">Delete</button>
  </td>
</tr>
